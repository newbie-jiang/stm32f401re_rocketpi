sample:
  name: AHT30 humidity/temperature sample
tests:
  sample.sensor.aht30:
    tags:
      - sensors
      - drivers
      - i2c
    depends_on:
      - i2c
      - sensor
    harness: console
    harness_config:
      type: one_line
      regex:
        - "AHT30 sample"
    platform_allow:
      - nucleo_f401re
    integration_platforms:
      - nucleo_f401re
