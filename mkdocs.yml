markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

extra:
  generator: true
  nav_links:
    - name: "🏠 首页"
      url: .
    - name: "🧭 学习路线"
      url: roadmap/roadmap/
    - name: "📁 资料下载"
      url: downloads/download/
    - name: "🧪 示例程序"
      url: doc/rocketpi_src/
    - name: "❓ 常见问题"
      url: faq/faq/
    - name: "💼 工具"
      url: tools/tools/
    - name: "📣 公告"
      url: community/announcement/
    - name: "👥 社区专栏"
      url: community/column/
  # 已去掉 RSS 的 social 链接，如需其他社交链接可在此处添加
  blog_category_icons:
    Bootloader: material/chip
    Networking: material/access-point
  nav_icons:
    blog/:
      icon: material/newspaper
      color: "#ff6f00"
    博客:
      icon: material/newspaper
      color: "#ff6f00"

extra_css:
